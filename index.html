
<!DOCTYPE html>

<html>
<head>
  <meta http-equiv="CONTENT-TYPE" content="text/html; charset=UTF-8">
  <title>My College ID Card</title>
  <link rel="Stylesheet" href="Style.css">
</head>
<body>
  <div class="card-container">
    <div class="id-card">
      <header class="card-header">
        <img src="Images/Collegelogo.jpg"
         width="100px" class="logo">
        <p>DR.B.R Ambedkar Autonomus college</p>
      </header>
      <div class="photo-wrap">
        <img src="Images/PassportPhoto.jpg"
          alt="profilephoto" class="photo">
      </div>
      <main class="card-body">
        <div class="name-section">
          <h2 class="student-name">Gouti Tarun</h2>
          <p class="college">DR.B.R Ambedkar Degree College</p>
        </div>
        <hr class="divider">
        <div class="details">
          <p><strong>Course:</strong>B.sc Computerscience</p>
          <p><strong>Birthday:</strong>30-May-2006</p>
        </div>
        <div class="id-line">
          <span class="id-label">ID NO:</span>
          <span class="id-value">0533</span>
        </div>
        <div class="barcode">
          
        </div>
        
      </main>
      <footer class="card-footer">
        <p class="footer-text">Issued by:College Inc</p>
      </footer>
    </div>
  </div>
</body>
</html>
